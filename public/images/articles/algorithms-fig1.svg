<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="A flowchart of how an algorithm runs: start, perform a step, check a condition, loop back while not done, and end when done." font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="al-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
  </defs>
  <rect width="760" height="560" fill="#ffffff"/>
  <text x="380" y="44" text-anchor="middle" font-size="29" font-weight="700" fill="#1a1a2e">How an Algorithm Flows</text>

  <!-- Start -->
  <ellipse cx="380" cy="100" rx="78" ry="30" fill="#2563eb"/>
  <text x="380" y="108" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">Start</text>

  <!-- Step -->
  <rect x="285" y="178" width="190" height="66" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="380" y="218" text-anchor="middle" font-size="20" font-weight="600" fill="#1d4ed8">Do a step</text>

  <!-- Decision -->
  <polygon points="380,292 482,366 380,440 278,366" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="380" y="373" text-anchor="middle" font-size="20" font-weight="600" fill="#1d4ed8">Done?</text>

  <!-- End -->
  <ellipse cx="380" cy="500" rx="78" ry="30" fill="#1e293b"/>
  <text x="380" y="508" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">End</text>

  <!-- arrows -->
  <g stroke="#2563eb" stroke-width="3" fill="none">
    <path d="M380 130 V178" marker-end="url(#al-arrow)"/>
    <path d="M380 244 V292" marker-end="url(#al-arrow)"/>
    <path d="M380 440 V470" marker-end="url(#al-arrow)"/>
    <!-- No: loop back from decision left to step -->
    <path d="M278 366 H150 V211 H285" marker-end="url(#al-arrow)"/>
  </g>
  <text x="372" y="466" text-anchor="end" font-size="17" font-weight="600" fill="#1a1a2e">Yes</text>
  <text x="158" y="290" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a2e">No</text>
</svg>
