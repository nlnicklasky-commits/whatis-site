<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="The von Neumann computer architecture: a CPU containing a control unit and an ALU, plus memory, input, and output, all connected by a shared system bus." font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="48" text-anchor="middle" font-size="29" font-weight="700" fill="#1a1a2e">The von Neumann Architecture</text>

  <!-- CPU -->
  <rect x="360" y="86" width="280" height="150" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="500" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">CPU</text>
  <rect x="384" y="126" width="106" height="84" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="437" y="166" text-anchor="middle" font-size="15" font-weight="600" fill="#1d4ed8">Control</text>
  <text x="437" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#1d4ed8">Unit</text>
  <rect x="510" y="126" width="106" height="84" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="563" y="174" text-anchor="middle" font-size="16" font-weight="600" fill="#1d4ed8">ALU</text>

  <!-- Memory -->
  <rect x="80" y="106" width="200" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="180" y="168" text-anchor="middle" font-size="20" font-weight="600" fill="#1d4ed8">Memory</text>

  <!-- Bus -->
  <rect x="80" y="300" width="840" height="40" rx="10" fill="#2563eb"/>
  <text x="500" y="326" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">System Bus</text>

  <!-- Input / Output -->
  <rect x="80" y="410" width="200" height="92" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="180" y="463" text-anchor="middle" font-size="20" font-weight="600" fill="#1d4ed8">Input</text>
  <rect x="720" y="410" width="200" height="92" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="820" y="463" text-anchor="middle" font-size="20" font-weight="600" fill="#1d4ed8">Output</text>

  <!-- connectors to bus -->
  <g stroke="#2563eb" stroke-width="3">
    <line x1="180" y1="216" x2="180" y2="300"/>
    <line x1="500" y1="236" x2="500" y2="300"/>
    <line x1="180" y1="340" x2="180" y2="410"/>
    <line x1="820" y1="340" x2="820" y2="410"/>
  </g>

  <text x="500" y="528" text-anchor="middle" font-size="17" fill="#4a5568">One shared bus carries data and instructions between the CPU, memory, and the outside world.</text>
</svg>
