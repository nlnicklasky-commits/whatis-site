<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Three common data structures compared: an array of contiguous cells, a linked list of nodes joined by pointers, and a tree branching from a root node." font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ds-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="480" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-size="29" font-weight="700" fill="#1a1a2e">Three Ways to Organize Data</text>

  <!-- Array -->
  <text x="200" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">Array</text>
  <g fill="#eff6ff" stroke="#2563eb" stroke-width="2.5">
    <rect x="70" y="150" width="52" height="52"/><rect x="122" y="150" width="52" height="52"/><rect x="174" y="150" width="52" height="52"/><rect x="226" y="150" width="52" height="52"/><rect x="278" y="150" width="52" height="52"/>
  </g>
  <text x="200" y="240" text-anchor="middle" font-size="16" fill="#64748b">contiguous cells, fast indexing</text>

  <!-- Linked list -->
  <text x="600" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">Linked List</text>
  <g fill="#eff6ff" stroke="#2563eb" stroke-width="2.5">
    <rect x="450" y="150" width="60" height="52" rx="8"/><rect x="560" y="150" width="60" height="52" rx="8"/><rect x="670" y="150" width="60" height="52" rx="8"/>
  </g>
  <g stroke="#2563eb" stroke-width="3" fill="none">
    <path d="M510 176 H560" marker-end="url(#ds-arrow)"/><path d="M620 176 H670" marker-end="url(#ds-arrow)"/>
  </g>
  <text x="600" y="240" text-anchor="middle" font-size="16" fill="#64748b">nodes joined by pointers</text>

  <!-- Tree -->
  <text x="1000" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">Tree</text>
  <g stroke="#2563eb" stroke-width="2.5">
    <line x1="1000" y1="170" x2="940" y2="240"/><line x1="1000" y1="170" x2="1060" y2="240"/>
    <line x1="940" y1="260" x2="900" y2="320"/><line x1="940" y1="260" x2="980" y2="320"/>
  </g>
  <g fill="#2563eb">
    <circle cx="1000" cy="160" r="20"/><circle cx="940" cy="250" r="20"/><circle cx="1060" cy="250" r="20"/><circle cx="900" cy="330" r="20"/><circle cx="980" cy="330" r="20"/>
  </g>
  <text x="1000" y="385" text-anchor="middle" font-size="16" fill="#64748b">branches from a root node</text>

  <text x="600" y="445" text-anchor="middle" font-size="18" fill="#4a5568">The structure you choose shapes how fast you can search, insert, and remove data.</text>
</svg>
