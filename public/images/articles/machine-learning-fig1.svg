<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="A neural network diagram: an input layer of three nodes connects to a hidden layer of five nodes, which connects to an output layer of two nodes." font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="46" text-anchor="middle" font-size="29" font-weight="700" fill="#1a1a2e">A Neural Network Learns Patterns</text>

  <!-- edges -->
  <g stroke="#cbd5e1" stroke-width="1.5">
    <!-- input(3) x=180 y=160,260,360  to hidden(5) x=450 y=120..400 -->
    <line x1="180" y1="160" x2="450" y2="120"/><line x1="180" y1="160" x2="450" y2="190"/><line x1="180" y1="160" x2="450" y2="260"/><line x1="180" y1="160" x2="450" y2="330"/><line x1="180" y1="160" x2="450" y2="400"/>
    <line x1="180" y1="260" x2="450" y2="120"/><line x1="180" y1="260" x2="450" y2="190"/><line x1="180" y1="260" x2="450" y2="260"/><line x1="180" y1="260" x2="450" y2="330"/><line x1="180" y1="260" x2="450" y2="400"/>
    <line x1="180" y1="360" x2="450" y2="120"/><line x1="180" y1="360" x2="450" y2="190"/><line x1="180" y1="360" x2="450" y2="260"/><line x1="180" y1="360" x2="450" y2="330"/><line x1="180" y1="360" x2="450" y2="400"/>
    <!-- hidden(5) to output(2) x=720 y=210,310 -->
    <line x1="450" y1="120" x2="720" y2="210"/><line x1="450" y1="120" x2="720" y2="310"/>
    <line x1="450" y1="190" x2="720" y2="210"/><line x1="450" y1="190" x2="720" y2="310"/>
    <line x1="450" y1="260" x2="720" y2="210"/><line x1="450" y1="260" x2="720" y2="310"/>
    <line x1="450" y1="330" x2="720" y2="210"/><line x1="450" y1="330" x2="720" y2="310"/>
    <line x1="450" y1="400" x2="720" y2="210"/><line x1="450" y1="400" x2="720" y2="310"/>
  </g>

  <!-- nodes -->
  <g fill="#2563eb">
    <circle cx="180" cy="160" r="20"/><circle cx="180" cy="260" r="20"/><circle cx="180" cy="360" r="20"/>
  </g>
  <g fill="#60a5fa">
    <circle cx="450" cy="120" r="20"/><circle cx="450" cy="190" r="20"/><circle cx="450" cy="260" r="20"/><circle cx="450" cy="330" r="20"/><circle cx="450" cy="400" r="20"/>
  </g>
  <g fill="#1d4ed8">
    <circle cx="720" cy="210" r="20"/><circle cx="720" cy="310" r="20"/>
  </g>

  <text x="180" y="445" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a2e">Input</text>
  <text x="450" y="445" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a2e">Hidden</text>
  <text x="720" y="445" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a2e">Output</text>
  <text x="450" y="492" text-anchor="middle" font-size="18" fill="#4a5568">Weighted connections adjust during training until the output matches the data.</text>
</svg>
