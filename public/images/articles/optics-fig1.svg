<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-label="A convex lens ray diagram: an object at twice the focal length forms a real, inverted, same-size image on the far side of the lens." font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="op-up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 10 L5 0 L10 10 z" fill="#1a1a2e"/></marker>
    <marker id="op-dn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L5 10 L10 0 z" fill="#1a1a2e"/></marker>
  </defs>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a1a2e">How a Convex Lens Forms an Image</text>

  <!-- optical axis -->
  <line x1="60" y1="300" x2="1040" y2="300" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="1030" y="322" text-anchor="end" font-size="16" fill="#64748b">optical axis</text>

  <!-- lens -->
  <ellipse cx="560" cy="300" rx="22" ry="150" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="560" y="475" text-anchor="middle" font-size="18" font-weight="600" fill="#1d4ed8">Lens</text>

  <!-- focal points -->
  <circle cx="380" cy="300" r="5" fill="#1a1a2e"/><text x="380" y="326" text-anchor="middle" font-size="17" fill="#1a1a2e">F</text>
  <circle cx="740" cy="300" r="5" fill="#1a1a2e"/><text x="740" y="326" text-anchor="middle" font-size="17" fill="#1a1a2e">F</text>

  <!-- rays -->
  <polyline points="200,180 560,180 920,420" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="200" y1="180" x2="920" y2="420" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- object arrow (up) -->
  <line x1="200" y1="300" x2="200" y2="182" stroke="#1a1a2e" stroke-width="3.5" marker-end="url(#op-up)"/>
  <text x="200" y="330" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">Object</text>

  <!-- image arrow (down, inverted) -->
  <line x1="920" y1="300" x2="920" y2="418" stroke="#1a1a2e" stroke-width="3.5" marker-end="url(#op-dn)"/>
  <text x="920" y="290" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">Image (inverted)</text>

  <text x="550" y="505" text-anchor="middle" font-size="18" fill="#4a5568">Parallel rays bend through the focal point; rays through the center pass straight. Where they cross, the image forms.</text>
</svg>
