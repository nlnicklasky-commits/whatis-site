<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="The scientific method as a cycle: ask a question, form a hypothesis, run an experiment, analyze the results, draw a conclusion, then refine and repeat." font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="sm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="440" fill="#ffffff"/>
  <text x="600" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#1a1a2e">The Scientific Method</text>

  <g font-size="20" font-weight="600">
    <rect x="20"  y="120" width="200" height="86" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="120" y="170" text-anchor="middle" fill="#1d4ed8">Question</text>
    <rect x="256" y="120" width="200" height="86" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="356" y="170" text-anchor="middle" fill="#1d4ed8">Hypothesis</text>
    <rect x="492" y="120" width="200" height="86" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="592" y="170" text-anchor="middle" fill="#1d4ed8">Experiment</text>
    <rect x="728" y="120" width="200" height="86" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="828" y="170" text-anchor="middle" fill="#1d4ed8">Analyze</text>
    <rect x="964" y="120" width="216" height="86" rx="12" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/><text x="1072" y="170" text-anchor="middle" fill="#ffffff">Conclude</text>
  </g>

  <g stroke="#2563eb" stroke-width="3" fill="none">
    <path d="M220 163 H256" marker-end="url(#sm-arrow)"/>
    <path d="M456 163 H492" marker-end="url(#sm-arrow)"/>
    <path d="M692 163 H728" marker-end="url(#sm-arrow)"/>
    <path d="M928 163 H964" marker-end="url(#sm-arrow)"/>
    <!-- refine & repeat loop back -->
    <path d="M1072 206 V300 a18 18 0 0 1 -18 18 H138 a18 18 0 0 1 -18 -18 V206" marker-end="url(#sm-arrow)"/>
  </g>
  <text x="600" y="345" text-anchor="middle" font-size="19" font-weight="600" fill="#1d4ed8">Refine &amp; repeat</text>
  <text x="600" y="400" text-anchor="middle" font-size="18" fill="#4a5568">Each conclusion raises new questions, and the cycle begins again.</text>
</svg>
